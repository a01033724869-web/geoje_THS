<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>럭키 넘버 추첨기</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h1 { color: #333; margin-bottom: 1.5rem; }
        .input-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .input-item {
            width: 45%;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #0056b3; }
        #result {
            font-size: 3rem;
            font-weight: bold;
            color: #007bff;
            margin-top: 1.5rem;
            height: 4rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .error { color: #ff4d4d; font-size: 0.8rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔢 숫자 추첨기</h1>
    
    <div class="input-group">
        <div class="input-item">
            <label>최소값</label>
            <input type="number" id="minNum" value="1">
        </div>
        <div class="input-item">
            <label>최대값</label>
            <input type="number" id="maxNum" value="45">
        </div>
    </div>

    <button onclick="pickNumber()">번호 뽑기</button>
    
    <div id="result">?</div>
    <div id="errorMsg" class="error">뽑을 수 있는 숫자가 없습니다!</div>
</div>

<script>
    function pickNumber() {
        const min = parseInt(document.getElementById('minNum').value);
        const max = parseInt(document.getElementById('maxNum').value);
        const resultDisplay = document.getElementById('result');
        const errorMsg = document.getElementById('errorMsg');
        
        // 1. 제외할 숫자 정의 (몰래 제외)
        const secretExclude = [6, 7, 8];
        
        // 2. 범위 내 가능한 숫자 배열 만들기
        let availableNumbers = [];
        for (let i = min; i <= max; i++) {
            if (!secretExclude.includes(i)) {
                availableNumbers.push(i);
            }
        }

        // 예외 처리 (범위 내 숫자가 없거나 제외된 숫자 뿐일 때)
        if (availableNumbers.length === 0) {
            errorMsg.style.display = 'block';
            resultDisplay.innerText = 'X';
            return;
        }
        errorMsg.style.display = 'none';

        // 3. 애니메이션 효과 (숫자가 0.5초 동안 빠르게 바뀜)
        let count = 0;
        const interval = setInterval(() => {
            const tempRandom = Math.floor(Math.random() * (max - min + 1)) + min;
            resultDisplay.innerText = tempRandom;
            count++;
            
            if (count > 10) {
                clearInterval(interval);
                // 4. 최종 결과 선택 (필터링된 배열에서만 뽑음)
                const finalIndex = Math.floor(Math.random() * availableNumbers.length);
                resultDisplay.innerText = availableNumbers[finalIndex];
            }
        }, 50);
    }
</script>

</body>
</html>
