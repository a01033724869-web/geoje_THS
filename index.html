<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 제비뽑기</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100-vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 { color: #333; margin-bottom: 1.5rem; font-size: 1.5rem; }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus { border-color: var(--primary-color); }

        button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active { transform: scale(0.98); background-color: #357abd; }

        #resultArea {
            margin-top: 2rem;
            padding: 20px;
            border-radius: 12px;
            background-color: #eef2f7;
            display: none;
        }

        .winner {
            font-size: 1.8rem;
            font-weight: 800;
            color: #e91e63;
            margin-top: 10px;
            word-break: break-all;
        }

        .confetti { font-size: 2rem; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 제비뽑기</h1>
    <textarea id="items" placeholder="항목을 줄바꿈으로 구분해서 입력하세요.&#10;예:&#10;김철수&#10;이영희&#10;박지민"></textarea>
    <button onclick="pickWinner()">추첨하기</button>

    <div id="resultArea">
        <div class="confetti">🎉</div>
        <div style="color: #666; font-size: 0.9rem;">당첨 결과</div>
        <div id="winnerDisplay" class="winner"></div>
    </div>
</div>

<script>
    function pickWinner() {
        const text = document.getElementById('items').value.trim();
        const resultArea = document.getElementById('resultArea');
        const winnerDisplay = document.getElementById('winnerDisplay');

        if (!text) {
            alert('항목을 입력해주세요!');
            return;
        }

        const list = text.split('\n').filter(item => item.trim() !== "");
        
        if (list.length === 0) {
            alert('유효한 항목이 없습니다.');
            return;
        }

        // 추첨 효과 (애니메이션 느낌을 위해 살짝 지연)
        winnerDisplay.innerText = "추첨 중...";
        resultArea.style.display = "block";

        setTimeout(() => {
            const randomIndex = Math.floor(Math.random() * list.length);
            winnerDisplay.innerText = list[randomIndex];
        }, 300);
    }
</script>

</body>
</html>
