<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤 번호 추첨기</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f2f5; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        input { width: 60px; padding: 8px; margin: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #result { font-size: 2rem; font-weight: bold; margin-top: 20px; color: #333; min-height: 2.5rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>번호 뽑기</h2>
    <div>
        <input type="number" id="min" value="1"> 부터
        <input type="number" id="max" value="100"> 까지
    </div>
    <button onclick="pickNumber()">번호 뽑기!</button>
    <div id="result">?</div>
</div>

<script>
    function pickNumber() {
        const min = parseInt(document.getElementById('min').value);
        const max = parseInt(document.getElementById('max').value);
        const resultDiv = document.getElementById('result');

        if (isNaN(min) || isNaN(max) || min > max) {
            alert("범위를 올바르게 입력해주세요.");
            return;
        }

        // 랜덤 숫자 생성 루직
        const randomNumber = Math.floor(Math.random() * (max - min + 1)) + min;
        
        // 결과 표시
        resultDiv.innerText = randomNumber;
    }
</script>

</body>
</html>
