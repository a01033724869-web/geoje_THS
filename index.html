<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>번호 뽑기 앱</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #ffffff; }
        .container { text-align: center; width: 80%; max-width: 400px; }
        input { width: 80px; padding: 12px; margin: 10px; border: 2px solid #eee; border-radius: 8px; font-size: 18px; text-align: center; }
        button { width: 100%; padding: 15px; background-color: #3182f6; color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; }
        #result { font-size: 5rem; font-weight: 800; margin-top: 30px; color: #3182f6; }
        p { color: #8b95a1; }
    </style>
</head>
<body>
    <div class="container">
        <p>숫자 범위를 입력하세요</p>
        <input type="number" id="min" value="1"> 
        <input type="number" id="max" value="100">
        <button onclick="pickNumber()">번호 뽑기</button>
        <div id="result">?</div>
    </div>
    <script>
        function pickNumber() {
            const min = parseInt(document.getElementById('min').value);
            const max = parseInt(document.getElementById('max').value);
            if (min >= max) { alert("범위를 확인해주세요!"); return; }
            document.getElementById('result').innerText = Math.floor(Math.random() * (max - min + 1)) + min;
        }
    </script>
</body>
</html>
